<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Raise/Lower tool icon (MarchingSquaresTerrain Rust port), drawn in the MST tool icon style. -->
<svg width="16" height="16" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hill" x1="0" x2="0" y1="6" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#f1f1f1;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#afafaf;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- ground slab -->
  <path d="M 0,11.5 8,15 16,11.5 8,8 Z" style="fill:#afafaf;fill-opacity:1"/>
  <!-- mound -->
  <path d="M 3,11.5 C 4.2,10.6 5,9.2 5.6,7.8 6.2,6.6 7,6 8,6 c 1,0 1.8,0.6 2.4,1.8 0.6,1.4 1.4,2.8 2.6,3.7 z" style="fill:url(#hill)"/>
  <!-- up arrow (raise) -->
  <path d="M 3,0.5 0.5,3.5 H 2.2 V 7.5 H 3.8 V 3.5 H 5.5 Z" style="fill:#eeeeee;fill-opacity:1"/>
  <path d="M 3,0.5 V 7.5 H 3.8 V 3.5 H 5.5 Z" style="fill:#949494;fill-opacity:1"/>
  <!-- down arrow (lower) -->
  <path d="M 13,7.5 10.5,4.5 H 12.2 V 0.5 H 13.8 V 4.5 H 15.5 Z" style="fill:#eeeeee;fill-opacity:1"/>
  <path d="M 13,7.5 V 0.5 H 13.8 V 4.5 H 15.5 Z" style="fill:#949494;fill-opacity:1"/>
</svg>
