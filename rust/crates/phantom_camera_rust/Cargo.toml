# Vendored, demo-only dependency: Rust port of Phantom Camera 0.11.0.3.
# Licence: GPL-3.0-only (see LICENSE; upstream Phantom Camera is MIT, LICENSE-PhantomCamera-MIT).
# Source: ~/g/g/open/client/rust/phantom-camera-rust @ open 60a7f6f. The MST addon (crate `mst`)
# must never depend on this crate.
[package]
name = "phantom-camera-rust"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"
rust-version = "1.97"
publish = false
description = "Rust GDExtension port of the Phantom Camera addon (v0.11.0.3) for Godot 4.7."

[lib]
name = "phantom_camera_rust"
crate-type = ["cdylib"]

[dependencies]
godot.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
